# 数据分布参数统计配置文件

  root: "_data\\optimize_data"
  shape: [1, 128, 128]  # [通道数, 高度, 宽度]
  factor_list: ["DEM", "DL", "GDP", "RK"]  # 驱动因子列表
  es_list: ["PODU"]
