# 混合训练集训练配置
# 遍历 attunet/segformer/transunet 三个模型，依次训练。
# 训练集使用 HybridDataset（10-15 与 15-20 两个来源各自贡献变化/未变化样本，变化样本按配额增强），
# 训练期验证集使用 val split 的 15-20 时间对；最终 sweep 使用 15-20 全量（train+val）口径。
device:
  use_gpu: true

# 训练机档位: "local"(本机) | "server"(4090服务器)
# 与下方 data.batch_size_overrides / optimizer 两个分支联动, 换机器只改这一行.
profile: "server"

# 混合训练集专属配置
hybrid:
  model_list: ["attunet", "segformer", "vit", "swin", "transunet"] # 依次训练的模型
  # 推导链: 由下面 4 个参数算出数据增强配额, 再以增强后变化样本数为基准算未变化样本数。
  #   raw_1015 = round(r1 × a), raw_1520 = round(r2 × b)        (a/b 为 train+val 变化池容量)
  #   Q = round(N × r_cu / (1 + r_cu))                          (目标增强后变化总数)
  #   Q_1015 = round(Q × raw_1015 / (raw_1015 + raw_1520)), Q_1520 = Q - Q_1015
  #   组内配额: 每样本 1 份原始 + base 份副本, 随机 rem 个样本再各多 1 份 => 精确命中 Q
  #   unchanged_g = round(Q_g / r_cu), 从同来源未变化池无放回抽取
  # 实测池子容量 (train+val 合计):
  #   10-15: 变化 a=294,  未变化 u_a=1521
  #   15-20: 变化 b=593,  未变化 u_b=1222
  # r2=1、r_cu=1 时 N 的可行区间交集为 [1774, 2444]（瓶颈是 15-20 未变化池 1222），推荐 N=2000。
  # 注意 r1=0 时未变化全部落在 15-20 池，N 上限收窄到 2444；若要用更大的 N，需把 r1 抬到 0.05 以上。
  # 若 N 过小或 r1 过大，构造时会直接报错并给出当前档位的可行区间。
  train_size: 2500 # 目标训练集样本量 N
  ratio_1015: 1.0 # r1: 10-15 变化样本加入比例 (占 10-15 变化池, train+val)
  ratio_1520: 0.5 # r2: 15-20 变化样本加入比例 (占 15-20 变化池, train+val)
  changed_unchanged_ratio: 1.0 # r_cu: 变化:非变化 目标比例 (1.0 表示 1:1)
  seed: 0 # 抽样与增强的随机种子
  train_seed: 0 # 训练种子基值: 权重初始化/增强翻转/批顺序; 第 i 个模型用 train_seed + i (可用 LU_TRAIN_SEED 覆盖)
  # attn 扫描 (HYBRID_ATTN_LIST) 时各 attn_type 的专属超参; 未列出者用 {}
  attn_kwargs_by_type:
    agent:
      num_agent: 16
  # 模块扫描 (HYBRID_TRANSUNET_LIST) 档位专属超参覆写: 按档位 spec 精确匹配.
  # 仅当档位 spec 与键完全一致时命中; 用于给显存占用大 / 易 OOM 的模块单独调参:
  #   batch_size     覆盖 data.batch_size_overrides[profile][model]
  #   learning_rate  覆盖 optimizer[profile][model].learning_rate
  # 未列出的档用默认值 (transunet: batch_size=32, learning_rate=0.00025).
  module_overrides:
    "baseline":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=carafe":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=dysample":
      batch_size: 8
      learning_rate: 0.000125
    "fusion_type=cross_scale":
      batch_size: 8
      learning_rate: 0.000125
    "use_m1=1":
      batch_size: 8
      learning_rate: 0.000125
    # 4.1 逐项开关消融的其余单开关档 (统一 bs8 / lr1.25e-4)
    "conv_type=large_kernel":
      batch_size: 8
      learning_rate: 0.000125
    "conv_type=parallel_local":
      batch_size: 8
      learning_rate: 0.000125
    "resblock_type=convnext":
      batch_size: 8
      learning_rate: 0.000125
    "high_res_skip=1":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=dysample+fusion_type=cross_scale":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=carafe+use_m1=1":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=dysample+use_m1=1":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=carafe+fusion_type=cross_scale":
      batch_size: 8
      learning_rate: 0.000125
    "fusion_type=cross_scale+use_m1=1":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=dysample+fusion_type=cross_scale+use_m1=1":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=carafe+fusion_type=cross_scale+use_m1=1":
      batch_size: 8
      learning_rate: 0.000125
    # M1 变体消融 (新增 3.5.1): 组A 同源/异构(位置固定 p8); 组B 异构 x 位置
    "m1_src=same+m1_pos=p8":
      batch_size: 8
      learning_rate: 0.000125
    "m1_src=hetero+m1_pos=p8":
      batch_size: 8
      learning_rate: 0.000125
    "m1_src=hetero+m1_pos=p4":
      batch_size: 8
      learning_rate: 0.000125
    "m1_src=hetero+m1_pos=p2":
      batch_size: 8
      learning_rate: 0.000125
    "m1_src=hetero+m1_pos=tok":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=dysample+m1_src=hetero+m1_pos=tok":
      batch_size: 8
      learning_rate: 0.000125
    "fusion_type=cross_scale+m1_src=hetero+m1_pos=tok":
      batch_size: 8
      learning_rate: 0.000125
    "up_type=dysample+fusion_type=cross_scale+m1_src=hetero+m1_pos=tok":
      batch_size: 8
      learning_rate: 0.000125

# 最终评测口径 (阈值扫描阶段)
sweep:
  eval_split: "all" # "all" = 15-20 的 train+val 全量; "val" = 仅 val split
  # 扫描阶段推理批大小 / DataLoader 并行进程数.
  # 留空(删除该行)则回退: batch_size 取 data.batch_size_overrides[profile] 最大值,
  # num_workers 取 data.num_workers_overrides[profile]; 不再复用 validation.batch_size(=1).
  batch_size: 8
  num_workers: 4

# 验证结果归档路径 (模板变量: {model_name} / {run_timestamp})
result:
  model_perf_dir: "results/_model_performance/{model_name}/{run_timestamp}"
  sweep_dir: "results/_model_performance/threshold_sweep/{run_timestamp}"

# 数据配置（训练集用 HybridDataset, 训练期验证集复用 TrainingDataset）
data:
  root: "_data/training_data"
  shape: [1, 128, 128]
  factor_list: ["DEM", "DL", "GDP", "RK"]
  shuffle: true
  normalize: true
  batch_size: 4 # 默认批次大小 (未被 batch_size_overrides 覆写时)
  # 按「机器档位 × 模型」的批大小, 与顶层 profile 联动
  batch_size_overrides:
    local: # 本机
      unet: 4 # 未实测, 取默认
      attunet: 4
      segformer: 8
      transunet: 1
      vit: 4
      swin: 4
      swinunet: 1
      crossformer: 1
    server: # 4090 服务器
      unet: 8
      attunet: 32
      segformer: 32
      transunet: 32
      vit: 32
      swin: 32
      swinunet: 8
      crossformer: 8
  # 按「机器档位」的 DataLoader 进程数, 与顶层 profile 联动.
  # 本机(Windows) 用 spawn: 建 worker 需把整个内存数据集序列化过去(实测 ~8.5s/DataLoader),
  # 而本机 batch 只有 1~8、__getitem__ 仅做索引, worker 无收益 => 0(主进程加载);
  # 服务器(Linux fork) 可零成本共享数据集, 用 4 把 collate/pin 挪出训练关键路径.
  num_workers_overrides:
    local: 0
    server: 4
  only_changed: false # 供训练期验证集 TrainingDataset 构造使用

training:
  # 损失函数: "original" = 各模型逐一对齐原始文献/官方实现:
  #             attunet   → Sørensen-Dice (smooth=0.01, 官方 SoftDiceLoss)
  #             unet      → 逐像素 softmax + 加权交叉熵 + weight map (w0=10, sigma=5)
  #             segformer → 未加权 CrossEntropy (≡ BCE)
  #             transunet → 0.5*CE + 0.5*Dice (smooth=1e-5, 官方实现)
  #             vit       → 未加权 softmax CE (≡ BCE, 无 label smoothing/mixup)
  #             fcn       → 未加权 CrossEntropy (≡ BCE)
  #             swin      → label smoothing 0.1 的 BCE (官方关闭 mixup 时的 LabelSmoothingCE 分支; mixup 未引入)
  #             swinunet  → 0.4*CE + 0.6*soft Dice (smooth=1e-5, 官方实现)
  #             crossformer → 未加权 CrossEntropy (≡ BCE, 官方实现)
  #             convlstm / cgan → 暂回退 0.5*BCE + 0.5*Dice (cgan 对抗损失需双网络; convlstm 原论文为回归)
  #           "focal_dice" = 统一 Focal+Dice 各 0.5 (保证多模型结构公平对比)
  loss_type: "original"
  select_metric: "f1_0.5" # checkpoint 选点准则: "f1_0.5"=按验证 F1@0.5 选最优; "val_loss"=回退旧口径
  save_frequency: 100
  print_frequency: 50
  visualize_frequency: 200
  num_epochs: 100
  warmup_epochs: 6 # 前n个epoch线性warmup (学习率由 base/warmup_steps 升至 base)
  lr_scheduler: # warmup 结束后按总步数 cosine 衰减
    name: "cosine" # cosine | none(仅 warmup, 之后保持峰值)
    min_lr: 0.000001 # cosine 末端学习率下限
  is_tensorboard: true
  log_frequency: 4
  log_dir: "logs/{model_name}/{run_timestamp}"
  checkpoint_dir: "checkpoints/{model_name}/{run_timestamp}"

# 优化器配置: 按「机器档位 (local/server) × 模型」, 与顶层 profile 联动.
# 数值依据 0914 本机 tensorboard 判断 + 服务器档按 √(bs_server/bs_local) 缩放:
#   attunet   本机 Dice 快速收敛且平稳        → 保持 1e-4         (bs 4→16,  ×2)
#   unet      本机加权CE噪声大、缓降未收敛     → 降 5e-5           (bs 4→8,   ×1.41)
#   segformer 本机 BCE 快速收敛至~0 且稳      → 保持 5e-5         (bs 8→32,  ×2)
#   transunet 本机 BCE+Dice 高位震荡后段才降   → 降 5e-5 + AdamW   (bs 1→8,   ×2.83)
#   vit/swin  截图未含, 沿用 Transformer 默认 → 保持 5e-5         (bs 4→32/16)
optimizer:
  local:
    default:
      {
        name: "adam",
        learning_rate: 0.0001,
        weight_decay: 0.00001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    attunet:
      {
        name: "adam",
        learning_rate: 0.0001,
        weight_decay: 0.00001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    unet:
      {
        name: "adam",
        learning_rate: 0.00005,
        weight_decay: 0.00001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    segformer:
      {
        name: "adamw",
        learning_rate: 0.00005,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    transunet:
      {
        name: "adamw",
        learning_rate: 0.00005,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    vit:
      {
        name: "adamw",
        learning_rate: 0.00005,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    swin:
      {
        name: "adamw",
        learning_rate: 0.00005,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    swinunet:
      {
        name: "adamw",
        learning_rate: 0.00005,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    crossformer:
      {
        name: "adamw",
        learning_rate: 0.00005,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
  server:
    default:
      {
        name: "adam",
        learning_rate: 0.0002,
        weight_decay: 0.00001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    attunet:
      {
        name: "adam",
        learning_rate: 0.00025,
        weight_decay: 0.00001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    unet:
      {
        name: "adam",
        learning_rate: 0.00007,
        weight_decay: 0.00001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    segformer:
      {
        name: "adamw",
        learning_rate: 0.0001,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    transunet:
      {
        name: "adamw",
        learning_rate: 0.00025,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    vit:
      {
        name: "adamw",
        learning_rate: 0.00014,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    swin:
      {
        name: "adamw",
        learning_rate: 0.00014,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    swinunet:
      {
        name: "adamw",
        learning_rate: 0.00014,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }
    crossformer:
      {
        name: "adamw",
        learning_rate: 0.00014,
        weight_decay: 0.0001,
        beta_1: 0.9,
        amsgrad: false,
        epsilon: 0.00000001,
        gradient_clip: 1.0,
      }

validation:
  split: "val"
  pack: [[15, 20]]
  batch_size: 8
  shuffle: false

model:
  segformer:
    dims: [32, 64, 160, 256]
    heads: [1, 2, 5, 8]
    ff_expansion: [8, 8, 4, 4]
    reduction_ratio: [8, 4, 2, 1]
    num_layers: 2
    decoder_dim: 256
  transunet:
    img_size: 128
    # 编码器注意力模块开关: vanilla(官方 MHSA) | agent(Agent Attention) | swinv2(Swin V2 缩放余弦注意力)
    attn_type: "vanilla"
    # 所选注意力模块的专属超参, 如 agent 的代理数 {"num_agent": 16}
    attn_kwargs: {}
    # M1: 编码器输出端驱动因子×LU 交叉注意力开关 (decoder 之前并联接入)
    use_m1: false
    # M1 变体 (新增 3.5.1 消融): 输入端 同源/异构 x 多位置; 两者同时设置才生效
    #   m1_src: same | hetero    m1_pos: tok(1/16) | p8(1/8) | p4(1/4) | p2(1/2)
    m1_src: null
    m1_pos: null
    # decoder 可插拔算子开关, 见 models/decoder_ops/; 默认项与官方 TransUNet 等价
    up_type: "bilinear"       # bilinear(默认) | dysample(替换 3.1) | carafe(新增 3.2, 仅末级并联)
    conv_type: "conv2drelu"   # conv2drelu(默认) | large_kernel(替换 3.2) | parallel_local(新增 3.4)
    fusion_type: "concat"     # concat(默认) | cross_scale(新增 3.3)
    # R50 主干 block 开关, 见 models/blocks/
    resblock_type: "preact"   # preact(默认) | convnext(替换 3.3)
    # 新增类开关
    parallel_local: false     # 新增 3.4 并联局部算子 (等价 conv_type=parallel_local)
    high_res_skip: false      # 新增 3.1 / B1 高分辨率注入
    n_skip: 3                 # skip 级数; high_res_skip 开启时自动提升到 4

  # 新增模型配置说明见 trainConfig.yaml 的 model 节
  convlstm:
    filters: [64, 128, 256, 512]
    kernel_size: 3
    num_layers: 1
    bias: true
  cgan:
    num_downs: 7
    ngf: 64
    norm: "batch"
    use_dropout: false
    output_activation: null
  vit:
    img_size: 128
    patch_size: 8
    dim: 384
    depth: 12
    heads: 6
    mlp_ratio: 4.0
    dropout: 0.0
    attn_dropout: 0.0
    decoder_dim: 256
  swin:
    img_size: 128
    patch_size: 4
    embed_dim: 96
    depths: [2, 2, 6, 2]
    num_heads: [3, 6, 12, 24]
    window_size: 7
    mlp_ratio: 4.0
    drop_path_rate: 0.1
    decoder_dim: 256
  swinunet:
    img_size: 128
    patch_size: 4
    embed_dim: 96
    depths: [2, 2, 2, 2]
    num_heads: [3, 6, 12, 24]
    window_size: 7
    mlp_ratio: 4.0
    drop_path_rate: 0.1
  crossformer:
    img_size: 128
    patch_size: [4, 8, 16, 32]
    embed_dim: 64
    depths: [1, 1, 8, 6]
    num_heads: [2, 4, 8, 16]
    group_size: [7, 7, 7, 7]
    crs_interval: [8, 4, 2, 1]
    mlp_ratio: 4.0
    drop_path_rate: 0.1
    decoder_dim: 256
